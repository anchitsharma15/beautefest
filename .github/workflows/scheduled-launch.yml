name: BeauteFest scheduled product launch

on:
  schedule:
    # 28 October at 06:30 UTC = 12:00 noon IST. Year/time guard is checked below.
    - cron: '30 6 28 10 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  APPROVED_RELEASE: ae0b176b5a5433b2e0e904a61259df6173dbe9c4
  PRODUCTION_BASELINE: 1379fd3acdff85129bda7763c704ef3bc9eef9dd

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.timing.outputs.publish }}
    steps:
      - name: Read launch controls
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_RELEASE }}
          path: approved-release
          persist-credentials: false
      - name: Validate release files
        run: |
          python3 .github/scripts/validate_scheduled_release.py approved-release/site
          node --check approved-release/site/app.js
      - name: Check one-time launch window
        id: timing
        run: python3 .github/scripts/release_time_gate.py
      - name: Record validation result
        run: |
          echo '## BeauteFest release validated' >> "$GITHUB_STEP_SUMMARY"
          echo 'Scheduled for 28 October 2026 at 12:00 noon IST (06:30 UTC).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Manual runs validate only; they never publish.' >> "$GITHUB_STEP_SUMMARY"
          echo "Approved commit: $APPROVED_RELEASE" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish allowed: ${{ steps.timing.outputs.publish }}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Open current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved site without overwriting newer site edits
        run: |
          if ! git diff --quiet "$PRODUCTION_BASELINE" HEAD -- site && ! git diff --quiet "$APPROVED_RELEASE" HEAD -- site; then
            echo 'Production website changed since scheduling. Refusing to overwrite newer edits.' >&2
            exit 1
          fi
          git rm -r --quiet site
          git checkout "$APPROVED_RELEASE" -- site README.md CONTENT-SOURCES.md
          python3 .github/scripts/validate_scheduled_release.py site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site README.md CONTENT-SOURCES.md
          if ! git diff --cached --quiet; then
            git commit -m 'Launch approved BeauteFest product-first website'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify secure website and product-first content
        run: |
          python3 - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(18):
              try:
                  for host in ['beautefest.in', 'www.beautefest.in']:
                      with urlopen('https://' + host + '/?release=20261028', timeout=20) as response:
                          page = response.read().decode()
                          assert response.status == 200
                          assert response.url.startswith('https://beautefest.in/')
                          assert 'assets/beautefest-logo.png' in page
                          assert 'data-product-category=' in page
                          assert 'CLIENT REVIEW PREVIEW' not in page
                  for path in ['assets/beautefest-logo.png', 'favicon.png', 'app.js', 'styles.css', 'privacy/']:
                      with urlopen('https://beautefest.in/' + path, timeout=20) as response:
                          assert response.status == 200, path
                  print('Secure apex/www, product-first content, logo and supporting pages verified.')
                  break
              except Exception as error:
                  if attempt == 17:
                      raise
                  print('Waiting for publication propagation:', type(error).__name__)
                  time.sleep(10)
          PY
      - name: Record launch result
        run: |
          echo '## BeauteFest launch completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Website: https://beautefest.in/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Secure apex/www and product-focused content verified.' >> "$GITHUB_STEP_SUMMARY"
